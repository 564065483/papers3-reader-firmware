[platformio]
default_envs = native
build_dir = .pio/build/preview_final

[env:native]
platform = native
build_type = release
extra_scripts = pre:extra_script.py
lib_extra_dirs = ../components, ../managed_components
lib_deps = M5GFX, ../managed_components/lvgl__lvgl
lib_ldf_mode = deep+
build_flags =
  -Iinclude
  -I../main/app
  -I../main/input
  -I../main/ui
  -IC:/msys64/ucrt64/include/SDL2
  -LC:/msys64/ucrt64/lib
  -lSDL2
  -DM5GFX_BOARD=board_M5PaperS3
  -DM5GFX_BACK_COLOR=0xdfe3e1u
  -I../managed_components/lvgl__lvgl
  -I../managed_components/lvgl__lvgl/src
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_FONT_SOURCE_HAN_SANS_SC_14_CJK=1
  -DLV_FONT_SOURCE_HAN_SANS_SC_16_CJK=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_24=1
  -DLV_FONT_MONTSERRAT_32=1
  -DLV_FONT_MONTSERRAT_48=1
  ; The bookshelf intentionally renders three rows (12 cards) in one page.
  ; Keep enough LVGL object memory for the full page in the native preview.
  -DLV_MEM_SIZE=196608
