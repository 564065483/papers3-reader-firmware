<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="电脑控制台">
  <meta name="theme-color" content="#06070c">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="icon" href="/static/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
  <title>电脑控制台</title>
</head>
<body>
  <div class="wallpaper"><i></i><i></i><i></i><i></i></div>
  <div id="login" class="login hidden"></div>

  <div id="app" class="app hidden">
    <nav id="nav" class="nav"></nav>
    <div class="main">
      <header class="topbar">
        <h1 id="title">控制台</h1>
        <div class="stats">
          <span class="chip opt" id="st-cpu"></span>
          <span class="chip opt" id="st-mem"></span>
          <span class="chip opt" id="st-net"></span>
          <span class="chip opt hidden" id="st-bat"></span>
          <button class="chip dev-pill" id="dev-pill"></button>
        </div>
      </header>
      <div class="views" id="views"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
